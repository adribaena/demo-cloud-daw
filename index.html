
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADAITS | Demo Cloud Computing</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #1b4176, #0b1223 65%);
      color: #f8fafc;
    }
    main {
      max-width: 640px;
      width: 100%;
      padding: 44px 36px;
      border-radius: 24px;
      background: #ffffff12;
      border: 1px solid #ffffff30;
      text-align: center;
    }
    .cloud { font-size: 64px; }
    h1 { font-size: 40px; }
    p { color: #cbd5e1; line-height: 1.6; }
    button {
      border: 0;
      background: #38bdf8;
      color: #082f49;
      font-weight: bold;
      border-radius: 12px;
      padding: 14px 22px;
      cursor: pointer;
    }
    #counter {
      font-size: 38px;
      font-weight: bold;
      color: #7dd3fc;
      margin: 15px;
    }
    small { color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <div class="cloud">☁️</div>
    <h1>Cloud Computing en acción</h1>
    <p><strong>Demo ADAITS · 1.º DAW + IA</strong></p>
    <p>Una web publicada en <strong>Microsoft Azure</strong>,
       sin administrar servidores.</p>

    <p>¡Prueba el contador!</p>
    <div id="counter">0</div>
    <button id="btn">Sumar un clic</button>

    <p><small>GitHub → Azure → Internet</small></p>
    <p><small>Al recargar, el contador vuelve a cero:
       no hay backend.</small></p>
  </main>
  <script>
    let clicks = 0;
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('counter').textContent = ++clicks;
    });
  </script>
</body>
</html>
