<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi primera web en la nube</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1b4176,#0b1223 65%);color:#f8fafc;padding:24px}
    main{max-width:640px;width:100%;padding:44px 36px;border-radius:24px;background:#ffffff12;border:1px solid #ffffff30;box-shadow:0 24px 80px #0005;text-align:center}
    .cloud{font-size:64px}h1{font-size:clamp(30px,5vw,48px);line-height:1.08;margin:14px 0}p{font-size:18px;color:#cbd5e1;line-height:1.6}
    button{border:0;background:#38bdf8;color:#082f49;font-weight:800;border-radius:12px;padding:14px 22px;cursor:pointer;font-size:16px}
    #counter{font-size:38px;font-weight:800;color:#7dd3fc;margin:10px}small{color:#94a3b8}
  </style>
</head>
<body>
  <main>
    <div class="cloud">☁️</div>
    <h1>¡Hola desde la nube!</h1>
    <p>Esta es una mini web creada para una charla de Cloud Computing con estudiantes de Desarrollo de Aplicaciones Web.</p>
    <p>Interacciones en esta pestaña:</p>
    <div id="counter">0</div>
    <button id="btn">¡Haz clic!</button>
    <p><small>HTML + CSS + JavaScript · Una web estática, sin servidor propio ni base de datos.</small></p>
  </main>
  <script>
    let clicks = 0;
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('counter').textContent = ++clicks;
    });
  </script>
</body>
</html>
